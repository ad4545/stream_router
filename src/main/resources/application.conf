pekko {
  loggers = ["org.apache.pekko.event.slf4j.Slf4jLogger"]
  loglevel = "DEBUG"
  logging-filter = "org.apache.pekko.event.slf4j.Slf4jLoggingFilter"
  log-dead-letters = 20
  log-dead-letters-during-shutdown = on

  actor {
    provider = "cluster"
    allow-java-serialization = off
    warn-about-java-serializer-usage = false

    serialization-bindings {
      "com.example.CborSerializable" = jackson-cbor
    }
  }

  remote.artery {
    canonical {
      hostname = "10.0.0.10"
      port = 25520  # Overridden per-node at startup
    }

    advanced {
      maximum-frame-size = 256000b
      buffer-pool-size = 128
    }
  }

  cluster {
    seed-nodes = [
      "pekko://ClusterSystem@10.0.0.9:25520",
      "pekko://ClusterSystem@10.0.0.10:25520"
    ]

    downing-provider-class = "org.apache.pekko.cluster.sbr.SplitBrainResolverProvider"
    min-nr-of-members = 1

    split-brain-resolver {
      active-strategy = keep-majority
      stable-after = 20s
    }
  }

  coordinated-shutdown.terminate-actor-system = on
  coordinated-shutdown.run-by-actor-system-terminate = on

  http {
    server {
      preview {
        enable-http2 = on
      }
    }
  }
}

# gRPC Server configuration
grpc {
  port = 8080
}

# Per-topic router configuration
# Topics are discovered dynamically as messages arrive.
stream-router {
  topic-actor-buffer-size = 1024
  grpc-topic-lookup-timeout = 5s
  grpc-topic-retry-backoff-max = 4

  # Bounded mailbox for TopicActor children.
  #
  # Why bounded:
  #   RouterActor sends StreamAck immediately after forwarding Publish, without
  #   waiting for TopicActor to consume the message.  Without a bound, the
  #   TopicActor mailbox can grow without limit at high ingest rates with zero
  #   gRPC subscribers (queue.offer drops the message, but Publish objects still
  #   accumulate in the unbounded actor mailbox).
  #
  # mailbox-push-timeout-time = 0s (non-blocking):
  #   When the mailbox is at capacity, new Publish messages are sent to dead
  #   letters immediately.  RouterActor is never blocked or slowed — the stream
  #   handler's backpressure credit keeps flowing, and the excess load is shed
  #   at this boundary.  Dead-letter logging (pekko.log-dead-letters = 20) gives
  #   operators early visibility before steady-state drop rates are reached.
  #
  # Capacity = topic-actor-buffer-size so a single config knob covers both the
  # actor mailbox depth and the Source.queue ring-buffer inside the TopicActor.
  topic-actor-mailbox {
    mailbox-type     = "org.apache.pekko.dispatch.BoundedMailbox"
    mailbox-capacity = 1024          # keep in sync with topic-actor-buffer-size
    mailbox-push-timeout-time = 0s  # non-blocking: overflow → dead letters
  }
}